name: CI/CD Galaxy

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compiler et tester le back
        working-directory: ./backend
        run: mvn clean verify

      - name: Résumé de couverture JaCoCo
        if: always()
        working-directory: ./backend
        run: |
          if [ ! -f target/site/jacoco/jacoco.csv ]; then
            echo "Pas de rapport JaCoCo (les tests n'ont pas pu s'exécuter)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9} END {
            printf "## Couverture JaCoCo\n\n| Métrique | Couverture |\n|---|---|\n"
            printf "| Instructions | %.1f%% |\n", 100*ic/(im+ic)
            printf "| Branches | %.1f%% |\n", 100*bc/(bm+bc)
            printf "| Lignes | %.1f%% (%d/%d) |\n", 100*lc/(lm+lc), lc, lm+lc
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/galaxy
            git pull origin main
            docker compose --profile prod up -d --build
            docker image prune -f