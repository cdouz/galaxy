spring.application.name=galaxy
server.port = 8080

spring.datasource.url=jdbc:mysql://localhost:3306/galaxy
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = validate

app.cors.allowed-origins=http://localhost:5173

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.cookie-secure=true

# Failed logins from one address before it is put on hold, and for how long.
app.security.login.max-attempts=5
app.security.login.lockout-duration=PT15M
