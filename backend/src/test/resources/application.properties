# Shadows the main application.properties: the test suite must not read the
# developer's .env, nor reach the database running in docker-compose.
# The datasource is supplied by TestcontainersConfiguration via @ServiceConnection.
spring.application.name=galaxy

spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=http://localhost:5173

app.jwt.secret=test-only-secret-never-used-outside-the-test-suite-0123456789
app.jwt.expiration-ms=86400000
app.jwt.cookie-secure=true
